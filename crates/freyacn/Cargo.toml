[package]
name = "freyacn"
version.workspace = true
edition.workspace = true
description = "A Freya component library with Tailwind‑inspired Fluent builder methods for building beautiful, theme‑aware UIs."
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
hotreload = ["freya/hotreload"]

[dependencies]
freya = { version = "0.5.0-rc.13", features = ["icons", "engine"] }
freya-core = "0.5.0-rc.13"
freya-icons = { version = "0.5.0-rc.10", features = ["lucide"] }
freyacn_macros.workspace = true
paste = "1.0.15"
rustc-hash = "2.1.3"
torin = "0.5.0-rc.13"
skia-safe = { package = "freya-skia-safe", version = "0.104.0" }
strum = { version = "0.28.0", features = ["derive"] }
regex = "1.13.1"
euclid = "0.22.14"
serde = "1.0.229"
serde_json = "1.0.154"
ureq = "3.5.0"
