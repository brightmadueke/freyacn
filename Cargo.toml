[workspace]
resolver = "3"
members = ["crates/freyacn_core", "crates/freyacn-macros", "crates/freyacn-cli", "crates/freyacn-shadcn", "crates/freyacn-material3", "crates/freyacn"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/brightmadueke/freyacn"
authors = ["Bright Madueke <maduekebright399@gmail.com>"]
documentation = "https://docs.rs/freyacn"
readme = "README.md"
keywords = ["freya", "ui", "components", "shadcn", "tailwind"]
categories = ["gui", "development-tools"]

[workspace.dependencies]
freyacn_macros = { version = "0.2.2", path = "crates/freyacn-macros" }
freyacn_core = { version = "0.2.2", path = "crates/freyacn_core" }
freyacn-shadcn = { version = "0.2.2", path = "crates/freyacn-shadcn" }
freyacn-material3 = { version = "0.2.2", path = "crates/freyacn-material3" }
